name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hum-windows-release"
          cache-on-failure: true

      - name: Download yt-dlp for embedding
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "vendor\yt-dlp.exe"

      - name: Build release binary with embedded yt-dlp
        env:
          HUM_EMBED_YT_DLP: ${{ github.workspace }}\vendor\yt-dlp.exe
        run: cargo build --release

      - name: Package Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\hum.exe dist\hum.exe
          Copy-Item target\release\hum.exe hum.exe
          Copy-Item LICENSE dist\LICENSE
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\* -DestinationPath hum-windows-x86_64.zip -Force

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            hum.exe
            hum-windows-x86_64.zip
