[package]
name = "hum"
version = "0.1.3"
edition = "2024"
description = "Lightweight desktop YouTube Music player"
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["tokio", "image", "svg"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp4", "mp3", "vorbis"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form", "charset", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
wry = "0.57"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
